name: AI reference

on:
  pull_request:
    branches: [main]
    paths:
      - reference/**
      - docs/ai/**
      - README.md
      - .github/workflows/ai-reference.yml

permissions:
  contents: read

concurrency:
  group: ai-reference-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13', '3.14']
    env:
      PYTHONPATH: reference
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run component and loopback transport tests
        run: python -m unittest discover -s reference/tests -v
      - name: Run synthetic workflow examples
        run: |
          python -m ai_baseline.demo
          python -m ai_baseline.analytics_demo
          python -m ai_baseline.report_demo --case complete --format markdown
